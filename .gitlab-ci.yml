image: node:24

stages:
  - verify

default:
  before_script:
    - corepack enable
    - corepack prepare pnpm@12.3.4 --activate

verify:
  stage: verify
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  script:
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm typecheck
    - pnpm test
    - pnpm build
